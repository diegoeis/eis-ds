# Fails when a generated file is not up to date with its source.
# Generated files: src/*/css/tokens.css, src/shared/css/icons.css, dist/, llms.txt (rules block), llms-full.txt.
name: Check generated files

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tokens are valid and tokens.css is up to date
        run: |
          python3 scripts/build-tokens.py
          git diff --exit-code -- 'src/*/css/tokens.css' || {
            echo "::error::tokens.css is not up to date. Run: python3 scripts/build-tokens.py"; exit 1; }

      - name: Scopes stay isolated and pages use only eis-* classes from src/
        run: python3 scripts/check-css.py

      - name: icons.css is up to date with the Lucide list
        run: python3 scripts/build-icons.py --check

      - name: dist/ is up to date
        run: python3 scripts/build-css.py --check

      - name: llms.txt and llms-full.txt are up to date with the manual
        run: python3 scripts/build-llms.py --check
